name: Generate Daily MCQ

on:
  schedule:
    # ทุกวัน 02:00 ICT (= 19:00 UTC วันก่อน)
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — generate + validate only, ไม่เขียนลงฐานข้อมูล"
        type: boolean
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # Sonnet 5's adaptive thinking + the larger detailed_explanation schema
    # made a full run take ~7-10m in testing — padded well past that.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate daily MCQ questions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
        run: node scripts/generate-mcq-daily.mjs
