name: Generate Daily MCQ

on:
  schedule:
    # ทุกวัน 02:00 ICT (= 19:00 UTC วันก่อน)
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate 30 MCQ questions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Repository variable (Settings → Variables): "deepseek" ให้ข้อ easy/medium
          # ใช้ DeepSeek; ไม่ตั้ง/ตั้ง "claude" = ใช้ Claude ตามเดิม — สลับได้ไม่ต้อง commit
          MCQ_GEN_PROVIDER: ${{ vars.MCQ_GEN_PROVIDER }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: node scripts/generate-mcq-daily.mjs
