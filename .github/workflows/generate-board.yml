name: Generate Daily Board MCQ

on:
  schedule:
    # ทุกวัน 02:30 ICT (= 19:30 UTC วันก่อน) — offset 30 นาทีจาก generate-mcq
    - cron: "30 19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — generate + validate only, ไม่เขียนลงฐานข้อมูล"
        type: boolean
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate 1 board MCQ per specialty (daily drip)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
        run: node scripts/generate-board-daily.mjs
