name: Generate MEQ Case Games

# แปลงข้อสอบ MEQ (progressive case) ที่ published แล้วเป็นเกมเคส (sim_scenarios
# category='meq') ด้วย scripts/generate-meq-games.ts — script ข้ามข้อที่มีเกมแล้ว
# ตั้งเวลา 30 นาทีหลังรอบสร้าง MEQ (generate-meq.yml) เพื่อเก็บของใหม่ รันมือได้ด้วย
#
# force=true: สร้างใหม่ทับข้อที่มีเกมแล้ว (upsert slug meq-<examId> เดิม) — ใช้หลัง
# เปลี่ยนรูปแบบเกม/prompt ข้อไหนสร้างไม่สำเร็จจะไม่ถูกเขียนทับ เกมเดิมยังอยู่
#
# ต้องมี repo secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, ANTHROPIC_API_KEY

on:
  # Scheduled by Vercel cron: /api/cron/dispatch-generators (lib/generator-schedule.ts)
  workflow_dispatch:
    inputs:
      force:
        description: "สร้างใหม่ทับข้อที่มีเกมแล้ว (true) หรือแปลงเฉพาะข้อที่ยังไม่มีเกม (false)"
        type: boolean
        default: false
      legacy_only:
        description: "ใช้คู่กับ force: สร้างใหม่เฉพาะข้อที่เกมยังเป็นรูปแบบเก่า (ไม่มีใบสั่งการรักษา) — เก็บตกข้อที่รอบก่อนล้ม"
        type: boolean
        default: false
      limit:
        description: "จำนวนสูงสุดต่อรอบ (เว้นว่าง = ทุกข้อ) — ลอง 3 ก่อนแล้วค่อยรันเต็ม"
        required: false
      publish:
        description: "เผยแพร่ทันที (true) หรือบันทึกเป็น draft (false) — ระวัง: force + draft จะซ่อนเกมที่ publish อยู่"
        type: boolean
        default: true
      concurrency:
        description: "แปลงพร้อมกันกี่เคส (ค่าเริ่มต้น 3)"
        required: false
      exam:
        description: "exam id (uuid) — สร้างเฉพาะข้อนี้ (เว้นว่าง = ทุกข้อ) ใช้คู่กับ force หลังแก้เนื้อหาข้อสอบ"
        required: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # ทั้งคลังใช้เวลานาน (เคสละ ~1-2 นาที แม้แปลงขนานกัน)
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Convert published MEQ exams into case games
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_LEGACY_ONLY: ${{ inputs.legacy_only }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_CONCURRENCY: ${{ inputs.concurrency }}
          INPUT_EXAM: ${{ inputs.exam }}
        run: |
          ARGS=""
          if [ "$INPUT_PUBLISH" != "false" ]; then ARGS="$ARGS --publish"; fi
          if [ "$INPUT_FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "$INPUT_LEGACY_ONLY" = "true" ]; then ARGS="$ARGS --legacy-only"; fi
          if [ -n "$INPUT_LIMIT" ]; then ARGS="$ARGS --limit $INPUT_LIMIT"; fi
          if [ -n "$INPUT_CONCURRENCY" ]; then ARGS="$ARGS --concurrency $INPUT_CONCURRENCY"; fi
          if [ -n "$INPUT_EXAM" ]; then
            if ! printf '%s' "$INPUT_EXAM" | grep -Eq '^[0-9a-fA-F-]{36}$'; then
              echo "exam must be a uuid" >&2; exit 1
            fi
            ARGS="$ARGS --exam $INPUT_EXAM"
          fi
          echo "Running: npm run gen:meqgames -- $ARGS"
          npm run gen:meqgames -- $ARGS
