# GitLab is a read-only mirror of the GitHub repo (.github/workflows/
# mirror-to-gitlab.yml). The content generators (blog, MCQ, board, MEQ, long
# case, ...) run on GitHub Actions — see .github/workflows/generate-*.yml.
# They were moved back from GitLab pipeline schedules after those stopped
# firing on 2026-09-19; delete any leftover schedules under Build → Pipeline
# schedules. Only the merge-request `verify` gate remains here.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Avoid GitLab's classic duplicate-pipeline flake (gitlab-org/gitlab-foss#33063):
    # when a branch has an open MR, a plain push would otherwise ALSO spawn a
    # branch pipeline for the same commit alongside the merge-request one —
    # GitLab then randomly marks one of the two "failed" with 0 jobs. Skip the
    # push pipeline whenever an MR pipeline will run instead.
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH' # ordinary push with no open MR — see the `no-op` job below

default:
  image: node:20
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --ignore-scripts --cache .npm --prefer-offline

# Ordinary push pipelines (no open MR) match the workflow's fallback rule but
# have no real job — without a real job here
# GitLab intermittently reports that empty pipeline as failed instead of
# skipped (long-standing upstream quirk: gitlab-org/gitlab-foss#33063). MR
# pipelines get the real `verify` job below instead, so skip this one there.
no-op:
  image: alpine:3
  before_script: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: on_success
  script:
    - echo "Nothing to run — content generators live in .github/workflows (see top of this file)."

# Gate for merge requests: lint + typecheck + test.
verify:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  timeout: 15m
  script:
    - npm run lint
    - npm run typecheck
    - npm test
