<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t" font-family="Sarabun, 'Noto Sans Thai', system-ui, -apple-system, sans-serif">
  <title id="t">เส้นทาง mannose-6-phosphate ส่ง enzyme เข้า lysosome 4 สถานี พร้อม safety lock และ I-cell disease</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#0f172a">M6P pathway — ส่ง enzyme เข้า lysosome ยังไง</text>

  <!-- stations -->
  <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="2">
    <rect x="40" y="140" width="235" height="290" rx="14"/>
    <rect x="335" y="140" width="235" height="290" rx="14"/>
    <rect x="630" y="140" width="235" height="290" rx="14"/>
    <rect x="925" y="140" width="235" height="290" rx="14"/>
  </g>
  <g fill="#e11d48">
    <circle cx="70" cy="170" r="18"/><circle cx="365" cy="170" r="18"/><circle cx="660" cy="170" r="18"/><circle cx="955" cy="170" r="18"/>
  </g>
  <g font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="70" y="177">1</text><text x="365" y="177">2</text><text x="660" y="177">3</text><text x="955" y="177">4</text>
  </g>
  <!-- icons -->
  <!-- 1: golgi sacs -->
  <g fill="#ffe4e6" stroke="#e11d48" stroke-width="2">
    <path d="M110 215 c20 -10 75 -10 95 0 c-20 10 -75 10 -95 0 z"/>
    <path d="M110 240 c20 -10 75 -10 95 0 c-20 10 -75 10 -95 0 z"/>
    <path d="M110 265 c20 -10 75 -10 95 0 c-20 10 -75 10 -95 0 z"/>
  </g>
  <circle cx="200" cy="215" r="7" fill="#d97706"/>
  <!-- 2: clathrin vesicle -->
  <circle cx="452" cy="240" r="34" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="5 5"/>
  <circle cx="452" cy="240" r="24" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <circle cx="452" cy="240" r="7" fill="#d97706"/>
  <!-- 3: endosome -->
  <circle cx="747" cy="240" r="34" fill="#ffe4e6" stroke="#e11d48" stroke-width="3"/>
  <text x="747" y="247" text-anchor="middle" font-size="18" fill="#e11d48">pH กรด</text>
  <!-- 4: lysosome -->
  <circle cx="1042" cy="240" r="34" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <g fill="#7c3aed">
    <circle cx="1030" cy="230" r="4"/><circle cx="1054" cy="236" r="4"/><circle cx="1038" cy="252" r="4"/><circle cx="1056" cy="256" r="4"/>
  </g>
  <!-- titles + descriptions -->
  <g font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">
    <text x="157" y="312">cis-Golgi</text>
    <text x="452" y="312">trans-Golgi network</text>
    <text x="747" y="312">endosome (pH กรด)</text>
    <text x="1042" y="312">lysosome</text>
  </g>
  <g font-size="20" fill="#0f172a" text-anchor="middle">
    <text x="157" y="348">ติดป้าย M6P</text>
    <text x="157" y="374">(mannose-6-phosphate)</text>
    <text x="157" y="400">บน hydrolase</text>
    <text x="452" y="348">M6P receptor จับ</text>
    <text x="452" y="374">→ clathrin-coated</text>
    <text x="452" y="400">vesicle</text>
    <text x="747" y="348">receptor ปล่อย enzyme</text>
    <text x="747" y="374">→ receptor กลับ Golgi</text>
    <text x="1042" y="348">ตัด phosphate ออก</text>
    <text x="1042" y="374">→ enzyme พร้อมทำงาน</text>
  </g>
  <!-- forward arrows -->
  <g stroke="#475569" stroke-width="3" marker-end="url(#arrow)">
    <line x1="277" y1="285" x2="331" y2="285"/>
    <line x1="572" y1="285" x2="626" y2="285"/>
    <line x1="867" y1="285" x2="921" y2="285"/>
  </g>
  <!-- receptor back to Golgi (dashed) -->
  <path d="M700 138 C700 96 500 96 480 136" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
  <text x="590" y="96" text-anchor="middle" font-size="20" fill="#475569">receptor กลับ Golgi</text>

  <!-- safety lock -->
  <rect x="40" y="480" width="1120" height="80" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="600" y="528" text-anchor="middle" font-size="22" fill="#0f172a"><tspan font-weight="700" fill="#0d9488">Safety lock:</tspan> enzyme ทำงานที่ pH 4.5–5.0 เท่านั้น · หลุดไป cytosol (pH 7.2) จะ inactive</text>

  <!-- I-cell disease -->
  <rect x="40" y="590" width="1120" height="90" rx="14" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
  <text x="600" y="627" text-anchor="middle" font-size="22" fill="#0f172a"><tspan font-weight="700" fill="#e11d48">I-cell disease</tspan> = ไม่มี GlcNAc phosphotransferase → ไม่มีป้าย M6P</text>
  <text x="600" y="659" text-anchor="middle" font-size="22" fill="#0f172a">→ enzyme หลุดออกนอกเซลล์</text>
</svg>
