<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="t" font-family="Sarabun, 'Noto Sans Thai', system-ui, -apple-system, sans-serif">
  <title id="t">Autophagy 4 ขั้น: โอบ organelle เก่า ปิดเป็น autophagosome เยื่อ 2 ชั้น รวมกับ lysosome แล้วย่อย</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <g id="oldmito">
      <rect x="-42" y="-19" width="84" height="38" rx="19" fill="#e2e8f0" stroke="#64748b" stroke-width="2.5"/>
      <g fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round">
        <path d="M-22 -19 v10 a5 5 0 0 0 10 0 v-10"/>
        <path d="M4 -19 v10 a5 5 0 0 0 10 0 v-10"/>
        <path d="M-8 19 v-10 a5 5 0 0 1 10 0 v10"/>
        <path d="M18 19 v-10 a5 5 0 0 1 10 0 v10"/>
      </g>
    </g>
  </defs>
  <rect width="1200" height="740" fill="#ffffff"/>
  <text x="600" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#0f172a">Autophagy — เซลล์กินตัวเองใน 4 ขั้น</text>

  <!-- panels -->
  <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="2">
    <rect x="40" y="100" width="240" height="400" rx="14"/>
    <rect x="333" y="100" width="240" height="400" rx="14"/>
    <rect x="626" y="100" width="240" height="400" rx="14"/>
    <rect x="919" y="100" width="240" height="400" rx="14"/>
  </g>
  <g stroke="#475569" stroke-width="3" marker-end="url(#arrow)">
    <line x1="284" y1="225" x2="329" y2="225"/>
    <line x1="577" y1="225" x2="622" y2="225"/>
    <line x1="870" y1="225" x2="915" y2="225"/>
  </g>

  <!-- 1: crescent around old mitochondrion -->
  <g transform="translate(160 225)">
    <use href="#oldmito" transform="rotate(-15)"/>
    <path d="M27 75 A80 80 0 1 1 27 -75 L23 -64 A68 68 0 1 0 23 64 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <!-- 2: closed double membrane -->
  <g transform="translate(453 225)">
    <circle r="80" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
    <circle r="68" fill="#f8fafc" stroke="#7c3aed" stroke-width="2.5"/>
    <use href="#oldmito" transform="rotate(-15)"/>
  </g>
  <!-- 3: fusion with lysosome -->
  <g transform="translate(746 225)">
    <circle cx="-25" r="66" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
    <circle cx="-25" r="55" fill="#f8fafc" stroke="#7c3aed" stroke-width="2.5"/>
    <use href="#oldmito" transform="translate(-25 0) rotate(-15) scale(0.85)"/>
    <circle cx="62" cy="22" r="40" fill="#ffe4e6" stroke="#e11d48" stroke-width="2.5"/>
    <g fill="#e11d48"><circle cx="50" cy="12" r="3.5"/><circle cx="72" cy="18" r="3.5"/><circle cx="58" cy="36" r="3.5"/><circle cx="78" cy="40" r="3.5"/></g>
    <text x="62" y="80" text-anchor="middle" font-size="18" fill="#e11d48">lysosome</text>
  </g>
  <!-- 4: digestion -->
  <g transform="translate(1039 225)">
    <circle r="80" fill="#ffe4e6" stroke="#e11d48" stroke-width="2.5"/>
    <circle r="62" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
    <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M-30 -20 l14 6"/><path d="M10 -30 l12 -4"/><path d="M-10 20 l10 10"/><path d="M25 15 l14 -6"/>
    </g>
    <g fill="#e11d48"><circle cx="-40" cy="10" r="3.5"/><circle cx="30" cy="-10" r="3.5"/><circle cx="0" cy="40" r="3.5"/><circle cx="-15" cy="-40" r="3.5"/><circle cx="45" cy="38" r="3.5"/></g>
  </g>

  <!-- stage titles -->
  <g font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">
    <text x="160" y="360">1  Nucleation</text>
    <text x="160" y="388">&amp; extension</text>
    <text x="453" y="360">2  Closure</text>
    <text x="746" y="360">3  Fusion</text>
    <text x="1039" y="360">4  Digestion</text>
  </g>
  <g font-size="20" fill="#0f172a" text-anchor="middle">
    <text x="160" y="430">เยื่อรูปพระจันทร์เสี้ยว</text>
    <text x="160" y="458">โอบ organelle เก่า</text>
    <text x="453" y="430">ปิดเป็น autophagosome</text>
    <text x="453" y="458">เยื่อ 2 ชั้น</text>
    <text x="746" y="430">รวมกับ lysosome /</text>
    <text x="746" y="458">late endosome</text>
    <text x="1039" y="430">acid hydrolase ย่อย</text>
    <text x="1039" y="458">เยื่อชั้นในและของข้างใน</text>
  </g>

  <!-- footer -->
  <rect x="40" y="580" width="1120" height="80" rx="14" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
  <text x="600" y="628" text-anchor="middle" font-size="22" fill="#0f172a"><tspan font-weight="700" fill="#e11d48">ใช้ทำอะไร:</tspan> รักษา homeostasis · กำจัด organelle เสีย · จัดเซลล์ใหม่ตอน differentiation</text>
</svg>
