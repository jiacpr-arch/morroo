<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t" font-family="Sarabun, 'Noto Sans Thai', system-ui, -apple-system, sans-serif">
  <title id="t">ภาพประกอบบทที่ 3: ไลโซโซมและ autophagosome เยื่อสองชั้นกำลังโอบไมโทคอนเดรียเก่า</title>
  <rect width="1200" height="675" fill="#ffffff"/>
  <!-- soft background -->
  <circle cx="140" cy="140" r="80" fill="#ede9fe" opacity="0.8"/>
  <circle cx="1080" cy="560" r="70" fill="#ffe4e6" opacity="0.9"/>
  <circle cx="600" cy="600" r="28" fill="#ede9fe"/>
  <circle cx="1090" cy="120" r="34" fill="#ffe4e6"/>
  <!-- lysosome -->
  <circle cx="380" cy="340" r="150" fill="#ffe4e6" stroke="#e11d48" stroke-width="5"/>
  <circle cx="380" cy="340" r="120" fill="#fff1f2"/>
  <g fill="#e11d48" opacity="0.75">
    <circle cx="330" cy="290" r="7"/><circle cx="380" cy="270" r="6"/><circle cx="430" cy="300" r="7"/>
    <circle cx="300" cy="350" r="6"/><circle cx="360" cy="340" r="8"/><circle cx="420" cy="360" r="6"/>
    <circle cx="340" cy="400" r="7"/><circle cx="400" cy="420" r="6"/><circle cx="450" cy="390" r="7"/>
    <circle cx="310" cy="310" r="4"/><circle cx="460" cy="340" r="5"/><circle cx="380" cy="380" r="5"/>
  </g>
  <!-- small vesicles -->
  <g fill="#fecdd3" stroke="#e11d48" stroke-width="3">
    <circle cx="560" cy="200" r="14"/><circle cx="590" cy="470" r="12"/><circle cx="220" cy="520" r="16"/>
  </g>
  <!-- autophagosome: double-membrane crescent closing -->
  <path d="M950 415 A150 150 0 1 1 950 265 L936 273 A134 134 0 1 0 936 407 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="4" stroke-linejoin="round"/>
  <!-- worn-out mitochondrion inside -->
  <g transform="translate(815 345) rotate(-20)">
    <rect x="-80" y="-34" width="160" height="68" rx="34" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/>
    <rect x="-64" y="-20" width="128" height="40" rx="20" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
    <g fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round">
      <path d="M-40 -20 v14 a8 8 0 0 0 16 0 v-14"/>
      <path d="M8 -20 v14 a8 8 0 0 0 16 0 v-14"/>
      <path d="M-16 20 v-14 a8 8 0 0 1 16 0 v14"/>
      <path d="M32 20 v-14 a8 8 0 0 1 16 0 v14"/>
    </g>
  </g>
  <!-- debris dots inside autophagosome -->
  <g fill="#94a3b8">
    <circle cx="730" cy="290" r="5"/><circle cx="880" cy="420" r="5"/><circle cx="760" cy="410" r="4"/>
  </g>
  <text x="48" y="630" font-size="22" fill="#64748b">Cell Biology · บทที่ 3</text>
</svg>
