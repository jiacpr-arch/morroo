<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t" font-family="Sarabun, 'Noto Sans Thai', system-ui, -apple-system, sans-serif">
  <title id="t">ภาพประกอบบทที่ 2: ไมโทคอนเดรียแบบสไตล์ พร้อมถุงเวสิเคิลและกอลจิ</title>
  <rect width="1200" height="675" fill="#ffffff"/>
  <!-- soft background -->
  <circle cx="160" cy="130" r="80" fill="#ffe4e6" opacity="0.8"/>
  <circle cx="1070" cy="580" r="70" fill="#fef3c7" opacity="0.9"/>
  <circle cx="120" cy="560" r="30" fill="#fef3c7"/>
  <!-- Golgi stack in background (top right) -->
  <g fill="#ffe4e6" stroke="#fda4af" stroke-width="2.5">
    <path d="M880 120 c40 -16 200 -16 240 0 c-40 16 -200 16 -240 0 z"/>
    <path d="M870 160 c44 -18 216 -18 260 0 c-44 18 -216 18 -260 0 z"/>
    <path d="M862 200 c48 -20 232 -20 280 0 c-48 20 -232 20 -280 0 z"/>
