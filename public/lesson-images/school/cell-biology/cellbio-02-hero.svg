    <circle cx="990" cy="400" r="12"/>
    <circle cx="1060" cy="340" r="20"/>
    <circle cx="200" cy="330" r="14"/>
    <circle cx="260" cy="460" r="18"/>
    <circle cx="880" cy="520" r="13"/>
  </g>
  <!-- mitochondrion -->
