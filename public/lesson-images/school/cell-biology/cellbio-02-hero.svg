    <rect x="-300" y="-120" width="600" height="240" rx="120" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <g fill="#ffe4e6" stroke="#d97706" stroke-width="3" stroke-linejoin="round">
