<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="t" font-family="Sarabun, 'Noto Sans Thai', system-ui, -apple-system, sans-serif">
  <title id="t">ภาพตัดขวางนิวเคลียส: เยื่อหุ้ม 2 ชั้น รูนิวเคลียส นิวคลีโอลัส โครมาทิน และ nuclear lamina พร้อม central dogma</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="780" fill="#ffffff"/>
  <text x="600" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#0f172a">Nucleus — ศูนย์ควบคุมของเซลล์</text>

  <!-- nuclear envelope: two membranes -->
  <circle cx="520" cy="360" r="200" fill="#e2e8f0" stroke="#475569" stroke-width="4"/>
  <circle cx="520" cy="360" r="186" fill="#f8fafc" stroke="#475569" stroke-width="3"/>
  <!-- nuclear lamina (inside inner membrane) -->
  <circle cx="520" cy="360" r="176" fill="none" stroke="#0d9488" stroke-width="3" stroke-dasharray="9 7"/>
  <!-- nuclear pores: gaps through both membranes -->
  <g fill="#ffffff" stroke="#475569" stroke-width="2">
    <rect x="512" y="152" width="16" height="30" rx="4" transform="rotate(20 520 360)"/>
    <rect x="512" y="152" width="16" height="30" rx="4" transform="rotate(65 520 360)"/>
    <rect x="512" y="152" width="16" height="30" rx="4" transform="rotate(110 520 360)"/>
    <rect x="512" y="152" width="16" height="30" rx="4" transform="rotate(155 520 360)"/>
    <rect x="512" y="152" width="16" height="30" rx="4" transform="rotate(200 520 360)"/>
    <rect x="512" y="152" width="16" height="30" rx="4" transform="rotate(245 520 360)"/>
    <rect x="512" y="152" width="16" height="30" rx="4" transform="rotate(290 520 360)"/>
    <rect x="512" y="152" width="16" height="30" rx="4" transform="rotate(335 520 360)"/>
  </g>
  <!-- euchromatin: loose strands -->
  <g fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
    <path d="M400 330 c25 -30 45 30 70 0 s45 30 70 0"/>
    <path d="M390 390 c25 -30 45 30 70 0 s45 30 70 0 s45 30 60 0"/>
    <path d="M430 450 c25 -30 45 30 70 0 s45 30 60 0"/>
    <path d="M440 260 c25 -30 45 30 70 0"/>
  </g>
  <!-- heterochromatin: dense clump -->
  <g fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round">
    <path d="M600 430 c10 -14 20 14 30 0 s20 14 30 0 s20 14 30 0"/>
    <path d="M598 444 c10 -14 20 14 30 0 s20 14 30 0 s20 14 30 0"/>
    <path d="M602 458 c10 -14 20 14 30 0 s20 14 30 0 s20 14 30 0"/>
    <path d="M606 472 c10 -14 20 14 30 0 s20 14 30 0"/>
  </g>
  <!-- nucleolus -->
  <circle cx="570" cy="300" r="46" fill="#94a3b8" stroke="#475569" stroke-width="3"/>
  <circle cx="570" cy="300" r="30" fill="#64748b" opacity="0.6"/>

  <!-- leader lines -->
  <g stroke="#64748b" stroke-width="2">
    <line x1="300" y1="212" x2="379" y2="219"/>
    <line x1="300" y1="470" x2="346" y2="440"/>
    <line x1="300" y1="345" x2="404" y2="332"/>
    <line x1="760" y1="258" x2="612" y2="290"/>
    <line x1="760" y1="336" x2="693" y2="329"/>
    <line x1="760" y1="438" x2="668" y2="444"/>
  </g>
  <g fill="#64748b">
    <circle cx="379" cy="219" r="4"/><circle cx="346" cy="440" r="4"/><circle cx="404" cy="332" r="4"/>
    <circle cx="612" cy="290" r="4"/><circle cx="693" cy="329" r="4"/><circle cx="668" cy="444" r="4"/>
  </g>
  <!-- labels left -->
  <g font-size="22" fill="#0f172a" text-anchor="end">
    <text x="290" y="205" font-weight="700">เยื่อหุ้มนิวเคลียส 2 ชั้น</text>
    <text x="290" y="233">(nuclear envelope)</text>
    <text x="290" y="338" font-weight="700">euchromatin</text>
    <text x="290" y="366">(หลวม, transcription ได้)</text>
    <text x="290" y="478" font-weight="700">รูนิวเคลียส (nuclear pore)</text>
    <text x="290" y="506">— ทางเข้าออกเดียว</text>
  </g>
  <!-- labels right -->
  <g font-size="22" fill="#0f172a">
    <text x="772" y="250" font-weight="700">นิวคลีโอลัส (nucleolus)</text>
    <text x="772" y="278">— สร้าง ribosome</text>
    <text x="772" y="343" font-weight="700" fill="#0d9488">nuclear lamina (บุด้านใน)</text>
    <text x="772" y="432" font-weight="700">heterochromatin</text>
    <text x="772" y="460">(แน่น, transcription น้อย)</text>
  </g>

  <!-- central dogma strip -->
  <rect x="40" y="610" width="1120" height="130" rx="14" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
  <text x="64" y="700" font-size="24" font-weight="700" fill="#475569">Central dogma</text>
  <g fill="#ffffff" stroke="#475569" stroke-width="2">
    <rect x="250" y="670" width="90" height="48" rx="14"/>
    <rect x="430" y="670" width="110" height="48" rx="14"/>
    <rect x="630" y="670" width="220" height="48" rx="14"/>
    <rect x="940" y="670" width="120" height="48" rx="14"/>
  </g>
  <g font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">
    <text x="295" y="702">DNA</text>
    <text x="485" y="702">mRNA</text>
    <text x="740" y="702">ผ่าน nuclear pore</text>
    <text x="1000" y="702">Protein</text>
  </g>
  <g stroke="#475569" stroke-width="3" marker-end="url(#arrow)">
    <line x1="342" y1="694" x2="428" y2="694"/>
    <line x1="542" y1="694" x2="628" y2="694"/>
    <line x1="852" y1="694" x2="938" y2="694"/>
  </g>
  <g font-size="20" fill="#64748b" text-anchor="middle">
    <text x="385" y="660">transcription</text>
    <text x="585" y="660">ออกจาก nucleus</text>
    <text x="895" y="660">translation</text>
  </g>
</svg>
