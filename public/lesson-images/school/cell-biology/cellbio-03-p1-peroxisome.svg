<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t" font-family="Sarabun, 'Noto Sans Thai', system-ui, -apple-system, sans-serif">
  <title id="t">เพอรอกซิโซม: เยื่อชั้นเดียว ปฏิกิริยา catalase กำจัด H2O2 และ β-oxidation ของ VLCFA พร้อมโรค Zellweger, ALD และ Refsum</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#0f172a">Peroxisome — ทำอะไร แล้วพังแล้วเป็นโรคอะไร</text>

  <!-- peroxisome -->
  <text x="330" y="124" text-anchor="middle" font-size="22" fill="#0f172a"><tspan font-weight="700">Peroxisome</tspan> — เยื่อชั้นเดียว · ไม่มี DNA/ribosome</text>
  <circle cx="330" cy="400" r="250" fill="#ffe4e6" stroke="#e11d48" stroke-width="4"/>

  <!-- (a) catalase flow -->
  <text x="260" y="214" text-anchor="middle" font-size="22" font-weight="700" fill="#e11d48">a) กำจัด H₂O₂</text>
  <g fill="#ffffff" stroke="#e11d48" stroke-width="2">
    <rect x="170" y="232" width="180" height="44" rx="14"/>
    <rect x="170" y="300" width="180" height="44" rx="14"/>
    <rect x="170" y="368" width="180" height="44" rx="14"/>
    <rect x="170" y="436" width="180" height="44" rx="14"/>
  </g>
  <g font-size="20" fill="#0f172a" text-anchor="middle">
    <text x="260" y="261">oxidation</text>
    <text x="260" y="329">H₂O₂ (พิษ)</text>
    <text x="260" y="397" font-weight="700">catalase</text>
    <text x="260" y="465">2H₂O + O₂</text>
  </g>
  <g stroke="#475569" stroke-width="3" marker-end="url(#arrow)">
    <line x1="260" y1="278" x2="260" y2="298"/>
    <line x1="260" y1="346" x2="260" y2="366"/>
    <line x1="260" y1="414" x2="260" y2="434"/>
  </g>

  <!-- (b) beta-oxidation -->
  <rect x="368" y="330" width="180" height="120" rx="14" fill="#ffffff" stroke="#e11d48" stroke-width="2"/>
  <g font-size="20" fill="#0f172a" text-anchor="middle">
    <text x="458" y="368" font-weight="700" fill="#e11d48">b) β-oxidation</text>
    <text x="458" y="396">very long chain</text>
    <text x="458" y="424">fatty acid (VLCFA)</text>
  </g>
  <!-- VLCFA zigzag -->
  <path d="M388 480 l16 -12 l16 12 l16 -12 l16 12 l16 -12 l16 12 l16 -12 l16 12" fill="none" stroke="#d97706" stroke-width="3" stroke-linejoin="round"/>

  <!-- disease panel -->
  <rect x="620" y="150" width="540" height="500" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="640" y="192" font-size="24" font-weight="700" fill="#e11d48">พังแล้วเป็นโรคอะไร</text>
  <g fill="#ffffff" stroke="#cbd5e1" stroke-width="2">
    <rect x="640" y="215" width="500" height="120" rx="14"/>
    <rect x="640" y="355" width="500" height="120" rx="14"/>
    <rect x="640" y="495" width="500" height="120" rx="14"/>
  </g>
  <g fill="#e11d48">
    <rect x="640" y="230" width="6" height="90" rx="3"/>
    <rect x="640" y="370" width="6" height="90" rx="3"/>
    <rect x="640" y="510" width="6" height="90" rx="3"/>
  </g>
  <g fill="#0f172a">
    <text x="668" y="256" font-size="22" font-weight="700">Zellweger syndrome</text>
    <text x="668" y="290" font-size="20">import protein เข้า peroxisome ไม่ได้</text>

    <text x="668" y="396" font-size="22" font-weight="700">Adrenoleukodystrophy (ALD)</text>
    <text x="668" y="424" font-size="20">X-linked · ABCD1</text>
    <text x="668" y="452" font-size="20">VLCFA สะสมในสมอง / ต่อมหมวกไต</text>

    <text x="668" y="536" font-size="22" font-weight="700">Refsum disease</text>
    <text x="668" y="570" font-size="20">phytanic acid สะสม</text>
  </g>
</svg>
